# Load balancer: spreads requests across all running API containers.
# Docker's DNS returns one address per "api" container, and nginx
# sends requests to them in turn (round-robin).
upstream phytoguard_api {
    server api:8000;
}

server {
    listen 80;
    client_max_body_size 200M;

    location / {
        proxy_pass http://phytoguard_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;

        # Shows which container answered each request
        add_header X-Served-By $upstream_addr always;
    }
}
